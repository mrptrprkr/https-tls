<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTPS & TLS | DevOps Homelab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }

        h1 {
            color: #38bdf8;
        }

        .secure {
            font-size: 1.2rem;
            margin: 25px 0;
        }

        code {
            background: #0f172a;
            padding: 5px 10px;
            border-radius: 5px;
        }

        a {
            color: #38bdf8;
        }
    </style>
</head>

<body>
<div class="card">
    <h1>HTTPS & TLS</h1>

    <p class="secure">🔒 Connection secured with TLS</p>

    <p>
        This application is served through Nginx using an
        SSL/TLS certificate.
    </p>

    <p>
        HTTP requests are automatically redirected to HTTPS.
    </p>

    <p>
        <code>HTTP :8080 → HTTPS :8443</code>
    </p>

    <p>
        DevOps Homelab Project
    </p>

    <p>
        <a href="https://webcurator.co.uk">webcurator.co.uk</a>
    </p>
</div>
</body>
</html>
